name: B05 modern native SS2022 pinned candidate manual RED GREEN UDP revoke/PSK, no binary
on:
  create:
  workflow_dispatch:
    inputs:
      purpose:
        description: 'Run exact pinned RED/GREEN modern SS2022 native socket and revoke/PSK unit tests. No proxy/ELF.'
        type: choice
        required: true
        options: ['verify-locked-source']
        default: verify-locked-source
permissions: {contents: read}
concurrency:
  group: qa-b05-modern-verified-candidate-manual-source-20261121
  cancel-in-progress: false
jobs:
  manual_exact_modern_core_original_socket_shortwrite_and_user_revoke_red_green:
    if: >-
      github.repository == 'Lison-Li/Xray-core' &&
      (
        (github.event_name == 'workflow_dispatch' &&
         github.ref == 'refs/heads/main' &&
         inputs.purpose == 'verify-locked-source') ||
        (github.event_name == 'create' &&
         github.event.ref_type == 'branch' &&
         github.event.ref == 'qa-b05-modern-ss2022-self-verify-20261121-c249df44')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
      GOMAXPROCS: '4'
      GOPROXY: https://proxy.golang.org|direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'c249df44131f66bd2b6f401ea2723849d3ad133d'
          fetch-depth: 16
          persist-credentials: false
      - uses: actions/setup-go@v6
        with: {go-version: '1.27.3', cache: false}
      - name: Immutable new modern core main lineage, two-file scope, no product/Worker rollout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = Lison-Li/Xray-core
          test "$(git rev-parse HEAD)" = c249df44131f66bd2b6f401ea2723849d3ad133d
          # Source checkout is immutable; accept ONLY manual dispatch on main,
          # or this one new owner-controlled QA ref creation event.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF" = 'refs/heads/main'
          elif [[ "$GITHUB_EVENT_NAME" == create ]]; then
            test "$GITHUB_REF" = 'refs/heads/qa-b05-modern-ss2022-self-verify-20261121-c249df44'
            test "$(jq -r .ref_type "$GITHUB_EVENT_PATH")" = branch
            test "$(jq -r .ref "$GITHUB_EVENT_PATH")" = 'qa-b05-modern-ss2022-self-verify-20261121-c249df44'
          else
            echo B05_MODERN_QA_UNKNOWN_EVENT_REJECTED
            exit 1
          fi
          test "$(go version)" = 'go version go1.27.3 linux/amd64'
          test "$(git rev-parse HEAD:go.mod)" = 06576d22bc285cef3087bbb3fb7f02b1e7938058
          test "$(git rev-parse HEAD:proxy/shadowsocks_2022/shadowsocks_2022.go)" = 44f18b171930e26db437fb14fe19928713a08ca0
          test "$(git rev-parse HEAD:proxy/shadowsocks_2022/inbound_multi.go)" = bcf9fdcce3b6fc402d12ab686164264d12bf711b
          test "$(git rev-parse HEAD:proxy/shadowsocks_2022/replay.go)" = 8d6c527d6ca0edeb1c965e39a62ab7e1833139a8
          test "$(git rev-parse HEAD:proxy/shadowsocks_2022/li_b05_modern_native_udp_cached_user_revoke_test.go)" = d94785963c4178ba5e2c30bad222a5a02ad443d7
          test "$(git rev-parse HEAD:proxy/shadowsocks_2022/li_b05_native_original_udp_socket_shortwrite_test.go)" = fc367e30aec418d4766bca7de9c238fc020704ab
          git cat-file -e 'a4a3dff5b20c2faae567b742c172c7b95e75c083^{commit}'
          test "$(git rev-parse a4a3dff5b20c2faae567b742c172c7b95e75c083:proxy/shadowsocks_2022/shadowsocks_2022.go)" = 1556c330f9f18e9ecb656a382ef1670621f3f97a
          test "$(git rev-list --count a4a3dff5b20c2faae567b742c172c7b95e75c083..HEAD)" = 14
          test "$(git diff --name-only a4a3dff5b20c2faae567b742c172c7b95e75c083 HEAD | sort | wc -l)" = 6
          grep -Fq 'return io.ErrShortWrite' proxy/shadowsocks_2022/shadowsocks_2022.go
          grep -Fq 'i.udpSessions.RevokeUser(u)' proxy/shadowsocks_2022/inbound_multi.go
          grep -Fq 'session.writeGate.Lock()' proxy/shadowsocks_2022/replay.go
          echo B05_MODERN_CORE_BASE_ANCHORED_EXACT_TRUE_NATIVE_UDP_SHORTWRITE_SOURCE=PASS
      - name: True RED on original main socket write (reject only expected unit assertion, not compiler failure)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/b05-modern"
          file=proxy/shadowsocks_2022/shadowsocks_2022.go
          cp "$file" "$RUNNER_TEMP/b05-modern/updated.go"
          git show a4a3dff5b20c2faae567b742c172c7b95e75c083:proxy/shadowsocks_2022/shadowsocks_2022.go > "$file"
          restore(){ cp "$RUNNER_TEMP/b05-modern/updated.go" "$file"; }
          trap restore EXIT
          set +e
          timeout --signal=TERM --kill-after=12s 570s go test -p=2 -count=1 -timeout=540s -run '^TestB05ModernSS2022ActualOriginalUDPSocketWriteMustRejectShortWrite$' ./proxy/shadowsocks_2022 > "$RUNNER_TEMP/b05-modern/red.log" 2>&1
          rc=$?
          set -e
          # The previous manual Action #44873882061 failed here, before
          # publishing its redirected RED test log. Print bounded original
          # Go failure diagnostics even if an assertion below fails; never
          # accept a compiler/dependency error as expected RED.
          echo "B05_RED_ORIGINAL_GO_TEST_EXIT=$rc"
          echo B05_RED_ORIGINAL_GO_TEST_LOG_BEGIN
          tail -n 120 "$RUNNER_TEMP/b05-modern/red.log" || true
          echo B05_RED_ORIGINAL_GO_TEST_LOG_END
          test "$rc" -ne 0 && test "$rc" -ne 124 && test "$rc" -ne 137
          grep -Fq 'TestB05ModernSS2022ActualOriginalUDPSocketWriteMustRejectShortWrite/short-original-datagram-no-OS-error' "$RUNNER_TEMP/b05-modern/red.log"
          grep -Fq 'original UDP socket write acceptance=<nil>, expected=short write' "$RUNNER_TEMP/b05-modern/red.log"
          if grep -Eqi '(^# |undefined:|no required module|build failed|panic:)' "$RUNNER_TEMP/b05-modern/red.log";then
            echo B05_OLD_CORE_COMPILATION_ERROR_NOT_ACCEPTED_AS_RED
            exit 1
          fi
          echo B05_MODERN_CORE_ACTUAL_OLD_NATIVE_SOCKET_SHORTWRITE_EXPECTED_RED=PASS
      - name: True GREEN on fixed modern core native actual final encrypted UDP socket and original package vet
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object proxy/shadowsocks_2022/shadowsocks_2022.go)" = 44f18b171930e26db437fb14fe19928713a08ca0
          timeout --signal=TERM --kill-after=12s 260s go test -p=2 -count=1 -timeout=235s -v -run '^TestB05ModernSS2022' ./proxy/shadowsocks_2022
          timeout --signal=TERM --kill-after=12s 240s go vet -p=2 ./proxy/shadowsocks_2022
          echo B05_MODERN_CORE_ACTUAL_NATIVE_UDP_ORIGINAL_SOCKET_SHORTWRITE_AND_REAL_REVOKE_READD_MATRIX_VET_GREEN=PASS
          echo B05_NO_PROXY_INSTALL_OR_RUN=YES
          echo B05_NO_PRODUCTION_OR_LIVE_NODE_MODIFICATION=YES
          echo B05_NO_BINARY_OR_ARTIFACT=YES
