name: B05 SS2022 native UDP original post-socket callback and short-write focused regression
on:
  push:
    branches: [qa/b05-ss2022-native-udp-encrypted-final-writer-20261119]
    paths: [.github/workflows/qa-b05-ss2022-native-udp-encrypted-shortwrite-once-20261119.yml]
permissions: {contents: read}
concurrency:
  group: qa-b05-ss2022-udp-shortwrite-once-20261119
  cancel-in-progress: false
jobs:
  github_hosted_source_regression_only:
    if: >-
      github.repository == 'Lison-Li/Xray-core' &&
      github.ref == 'refs/heads/qa/b05-ss2022-native-udp-encrypted-final-writer-20261119' &&
      github.event.head_commit.message == '[qa-b05-ss2022-encrypted-udp-shortwrite-source-once-20261119]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
      GOMAXPROCS: '4'
      GOPROXY: https://proxy.golang.org|direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Pin true unchanged fork module, isolated native SS2022 UDP source and regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$GITHUB_REPOSITORY" = Lison-Li/Xray-core
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(go version)" = 'go version go1.27.3 linux/amd64'
          test "$(git rev-parse HEAD:go.mod)" = d67419b6d6587ba848cb8211b8c9d3cd0a912c86
          test "$(git rev-parse HEAD:proxy/shadowsocks_2022/inbound.go)" = dae4c4050297fe99617a8ad59ad7eb2a81e211a7
          test "$(git rev-parse HEAD:proxy/shadowsocks_2022/li_b05_native_udp_encrypted_socket_write_test.go)" = 64ec37a5d218a053e8a5194ba765e3192c5d8115
          test "$(git rev-parse HEAD:proxy/shadowsocks_2022/outbound.go)" = 448e9802553a0c878ec0d0b7aa2121883ed433e7
          test "$(git rev-parse HEAD:proxy/shadowsocks_2022/inbound_multi.go)" = c6d2a7fe9974394722fce80b6e175378724f48e2
          test "$(git rev-parse HEAD:proxy/shadowsocks_2022/li_b05_native_udp_original_final_writer_receipt_qa.go)" = 16b5a7429cfda9f2aa941093662a39bb03a8a795
          test "$(git rev-parse HEAD:proxy/shadowsocks_2022/li_b05_native_udp_original_final_writer_receipt_qa_test.go)" = 9692f66421eb08dbfa9df359e8be01040c91de0d
          grep -Fq 'liB05SS2022NativeUDPWrapOriginal(ctx, link.Reader, conn)' proxy/shadowsocks_2022/inbound_multi.go
          grep -Fq 'LiB05SS2022NativeUDPOriginalSocketReceiptHookReady' proxy/shadowsocks_2022/li_b05_native_udp_original_final_writer_receipt_qa.go
          grep -Fq 'defer cancel()' proxy/shadowsocks_2022/outbound.go
          grep -Fq 'return io.ErrShortWrite' proxy/shadowsocks_2022/inbound.go
          grep -Fq 'TestB05SS2022NativeEncryptedUDPSocketWriteMustBeComplete' proxy/shadowsocks_2022/li_b05_native_udp_encrypted_socket_write_test.go
          echo QA_B05_SS2022_NATIVE_UDP_SOURCE_HASHES_PINNED=PASS
      - name: Test original SS2022 encrypted socket and independently gated post-socket final callback
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=10s 500s go test -p=4 -count=1 -timeout=450s -v -run '^TestB05SS2022Native(EncryptedUDPSocketWriteMustBeComplete|OriginalUDP)' ./proxy/shadowsocks_2022
          echo QA_B05_SS2022_NATIVE_UDP_ORIGINAL_CALLBACK_AND_SOCKET_BOUNDARY_GO_TEST=PASS_UNIT_ONLY
      - name: Vet exact changed source package without any installed or running proxies
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=10s 100s go vet -p=4 ./proxy/shadowsocks_2022
          echo QA_B05_SS2022_NATIVE_UDP_SOCKET_BOUNDARY_VET=PASS
          echo QA_PROXY_PROGRAM_INSTALLED_OR_EXECUTED=NO
          echo QA_GITHUB_ACTIONS_ARTIFACTS_UPLOADED=ZERO
