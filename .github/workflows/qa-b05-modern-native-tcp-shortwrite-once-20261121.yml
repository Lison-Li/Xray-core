name: QA B05 modern native original encrypted TCP shortwrite pinned once
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  modern_native_ss2022_original_tcp_write_gate:
    if: ${{ github.event.issue.pull_request && github.event.issue.number == 2 && github.event.comment.body == '/qa-b05-modern-2b11754a-tcp-shortwrite-once' && github.event.comment.user.login == 'Lison-Li' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
      CGO_ENABLED: "1"
      GOOS: linux
      GOARCH: amd64
      GOMAXPROCS: "4"
    steps:
      - name: Exact native candidate checkout
        uses: actions/checkout@v4
        with:
          ref: 2b11754ae0c94e51a5c36746756572347a98d650
          fetch-depth: 0
          persist-credentials: false
      - name: Go 1.27.3
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.3
          cache: false
      - name: Verify immutable Go source and issue comment origin
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REPOSITORY" = Lison-Li/Xray-core
          test "$GITHUB_EVENT_NAME" = issue_comment
          test "$(jq -r .issue.number "$GITHUB_EVENT_PATH")" = 2
          test "$(jq -r .comment.body "$GITHUB_EVENT_PATH")" = '/qa-b05-modern-2b11754a-tcp-shortwrite-once'
          test "$(git rev-parse HEAD)" = 2b11754ae0c94e51a5c36746756572347a98d650
          test "$(git rev-parse HEAD^)" = 98fd1caed03453938e4d9848dea3b4170bf410a1
          test "$(git rev-parse HEAD:go.mod)" = 06576d22bc285cef3087bbb3fb7f02b1e7938058
          test "$(git rev-parse HEAD:proxy/shadowsocks_2022/stream.go)" = ddb5c18b2d73b5bbca97259a3185993973f88572
          test "$(git rev-parse HEAD:proxy/shadowsocks_2022/li_b05_modern_native_tcp_shortwrite_test.go)" = fda9c1c3653bc534efa3c3d72798622c017a4b62
          test "$(go version)" = 'go version go1.27.3 linux/amd64'
          echo B05_NEW_CORE_PHYSICAL_TCP_WRITE_SOURCE_PROVENANCE=PASS
      - name: Actual 2x full native SS2022 package race and Go vet
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=15s 840s \
            go test -race -p=2 -count=2 -timeout=800s ./proxy/shadowsocks_2022
          echo B05_NEW_CORE_ORIGINAL_ENCRYPTED_TCP_CHUNK_CLIENT_SERVER_HEADER_SHORTWRITE_AND_UDP_RACE=PASS
          go vet -p=2 ./proxy/shadowsocks_2022
          echo B05_NEW_CORE_TCP_SHORTWRITE_GO_VET=PASS
          echo B05_NO_PROXY_EXECUTION_NO_ARTIFACT_NO_PRODUCTION=YES
